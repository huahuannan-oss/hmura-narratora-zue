name: AIMA Android APK
on:
  push:
    branches: [aima-android-apk-2026-11-09]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify Android SDK available on runner
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls -al "$ANDROID_HOME/cmdline-tools" || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --version || sdkmanager --version
      - name: Install SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Create launcher image from original golden head
        run: |
          python3 - <<'PY'
          import re,base64,pathlib
          page=pathlib.Path('aima-android/app/src/main/assets/index.html').read_text()
          match=re.search(r'data:image/png;base64,([A-Za-z0-9+/=]+)',page)
          assert match,'Brak oryginalnej zlotej glowy'
          dst=pathlib.Path('aima-android/app/src/main/res/drawable-nodpi/ic_launcher.png')
          dst.parent.mkdir(parents=True,exist_ok=True)
          dst.write_bytes(base64.b64decode(match.group(1)))
          PY
      - name: Build installable APK
        working-directory: aima-android
        run: gradle :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: AIMA-CYBER-SYNTETYC-APK
          path: aima-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
